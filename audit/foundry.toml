[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.28"
optimizer = true
optimizer_runs = 500
via_ir = false
evm_version = "cancun"
bytecode_hash = "ipfs"
cbor_metadata = true
auto_detect_remappings = false
allow_paths = [".."]
fs_permissions = [{ access = "read", path = "./fixtures" }]

# Local tests only. There is no broadcast profile and no RPC endpoint here.
# Do not add one. These tests must never be pointed at LUKSO Mainnet or Testnet.
